  <!-- sto sa šoljom -->
  <g transform="translate(360 352)">
    <ellipse cx="40" cy="106" rx="150" ry="20" fill="#120d09" opacity=".55"/>
    <rect x="-90" y="66" width="260" height="14" rx="7" fill="#2f2118"/>
    <rect x="-60" y="80" width="10" height="46" fill="#241a12"/>
    <rect x="130" y="80" width="10" height="46" fill="#241a12"/>
    <path d="M6 30h54v18a27 27 0 0 1-54 0z" fill="#f7f2e9"/>
    <rect x="-8" y="60" width="86" height="7" rx="3.5" fill="#e3d9c8"/>
    <path d="M60 34h9a9 9 0 0 1 0 18h-9" fill="none" stroke="#f7f2e9" stroke-width="5"/>
    <g fill="none" stroke="#f7f2e9" stroke-width="3" stroke-linecap="round" opacity=".6">

# Rezervna, ručna objava — redovnu objavu radi Cloudflare Workers Builds,
# koji sam povlači sa Git-a i ne traži nikakvu tajnu u GitHub-u.
#
# Ovaj workflow se pokreće samo ručno (Actions -> Deploy -> Run workflow) i
# tek tada traži tajnu CLOUDFLARE_API_TOKEN. Dok je nema, ne radi ništa i ne
# obeležava commite crvenim.
name: Deploy

on:
  workflow_dispatch:

# Dve objave odjednom bi se gazile; novija čeka da starija završi.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Projekat nema build korak ni lockfile, pa wrangler ide direktno.
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
